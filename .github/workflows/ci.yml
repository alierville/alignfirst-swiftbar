name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx biome ci .

      - run: npm run typecheck

      - run: npm test

      - run: npx alignfirst docmap --check

      # workspace-bar calls /usr/sbin/lsof, the macOS path. On Linux, a shim there hands the
      # call to the real lsof, so the end-to-end test observes the real listening sockets.
      - name: Install lsof shim
        run: |
          test ! -e /usr/sbin/lsof
          test -x /usr/bin/lsof
          sudo install -m 755 test/fixtures/linux-lsof.sh /usr/sbin/lsof

      - run: npm run test:e2e
